
name: Build PlantERA Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller qtawesome packaging

      
      - name: Build PlantERA.exe
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if (-not $env:SUPABASE_URL -or -not $env:SUPABASE_KEY) {
            throw "Missing Supabase configuration"
          }

          "SUPABASE_URL=$env:SUPABASE_URL" | Set-Content ".env"
          "SUPABASE_KEY=$env:SUPABASE_KEY" | Add-Content ".env"

          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name PlantERA `
            --icon "assets/img/logo/plantera_logo.ico" `
            --add-data "assets;assets" `
            --add-data "config;config" `
            --add-data "styles;styles" `
            --add-data ".env;." `
            --hidden-import services.supabase_service `
            --collect-all qtawesome `
            --collect-submodules esptool `
            --collect-submodules ui.views `
            --exclude-module PIL `
            main.py

          Remove-Item ".env" -ErrorAction SilentlyContinue

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/PlantERA.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  PlantERA.exe" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/PlantERA.exe" `
            "dist/SHA256SUMS.txt" `
            --title "PlantERA ${{ github.ref_name }}" `
            --generate-notes
