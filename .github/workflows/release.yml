
name: Build PlantERA Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PlantERA.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name PlantERA `
            --icon "assets/img/logo/plantera_logo.ico" `
            --add-data "assets;assets" `
            --add-data "styles;styles" `
            --add-data "config;config" `
            --collect-all esptool `
            main.py

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/PlantERA.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  PlantERA.exe" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/PlantERA.exe" `
            "dist/SHA256SUMS.txt" `
            --title "PlantERA ${{ github.ref_name }}" `
            --generate-notes
